name: Generate Podcast Feed

on:
  push:
    branches:
      - main
    paths:
      - 'feed.yaml'
      - 'feed.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML

      - name: Run Feed Generator
        run: python feed.py

      - name: Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add podcast.xml
          git diff --staged --quiet || (git commit -m "Update podcast feed [skip ci]" && git push)
